name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-boot-redis
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

  compose-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Docker and Compose schema
        run: |
          docker info
          docker compose config --quiet
      - name: Build WAR and start Tomcat with Redis
        run: |
          ./build.sh
          docker compose up --build -d
      - name: Verify the deployed WAR context and Redis access
        run: |
          curl --fail --connect-timeout 2 --max-time 5 --retry 30 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/web/hello | grep -F 'Hello World! I have been seen :'
          curl --fail http://127.0.0.1:8080/web/redis/set/world | grep -Fx 'set OK !'
          curl --fail http://127.0.0.1:8080/web/redis/get | grep -Fx 'world'
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "http://127.0.0.1:8080/web/redis/get/missing-${GITHUB_RUN_ID}")"
          test "$status" = 404
      - name: Verify real Redis endpoints and concurrent atomic increments
        run: |
          ./test.sh -Predis-integration verify \
            -Dintegration.redis.host=127.0.0.1 \
            -Dintegration.redis.port=6379 -Dintegration.redis.database=15
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop only this job's Compose stack
        if: always()
        run: docker compose down --volumes